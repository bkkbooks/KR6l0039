body:
  text: 建安沙門法盈修解前序分二初歎西土論興之益二大唐三藏下此方傳譯請制疏之由初中分二初讚千部能次至於下別彰此論之德昔釋迦至千部者此總標千部昔者往也易云昔者聖人作易也往古來今為昔釋迦者是姓也此云能仁昔賢劫初有王名三昧多此云共許王即剎利種是佛遠祖也此王子孫相承有十九大轉輪王第十九王名大須彌王子孫相承有十七萬三千二百八十四小轉輪王其最後輪王名魚王子孫相承有一百四十三粟散王其最後王名大茅草王即是佛七代祖初無子息將以國事委政羣臣入山修道為獵者誤射命終肉滴血墮地生兩莖甘蔗貴族應霸精誠潛託甘蔗為日炙開割一莖生男名善生一莖生女名善賢諸臣即立善生嗣位從此稱之瞿曇氏此云日炙種或甘蔗種即是佛六代祖後緣嫡妃忌妒遂擯庶子尼㸸羅等兄弟四人此云別成等居雪山四子建國安人故父王聞已讚曰我子能仁我子能仁因此立姓釋氏是佛五代祖若言瞿曇及喬答摩多是外道毀佛詞也天親菩薩者梵云提婆盤豆此云天親漢梵皆訛也舊云婆藪盤豆新云筏蘇盤豆亦云筏蘇畔度此云世親劫初之時自在天二十四返人間行化第二十四返現三目八臂身遇目足仙人語仙人曰如我面上有三目即堪與我論議仙人舉足報曰如我足下有目我即與我論議天知墮負現羸瘦形却歸本天更不復來人間時人仰慕天德為之立祠鑄黃金為身頗梨為眼座高二丈號此天像為筏蘇盤豆謂與世人為親友故云世親父母於天祠乞得三子皆從所乞處為名也北印度境有國名富樓沙富羅富樓沙此云丈夫富羅此云志國是帝釋弟能伏修羅建丈夫志因此立名也毗搜紐天王傳云帝釋為伏修羅遣弟毗搜紐天於此國生為提婆王子此國有修羅名因陀羅陀摩耶因陀羅是帝釋名陀摩耶此云伏此修羅有大力常與帝釋戰能伏帝釋故有此名修羅有妹名婆頗婆底婆頗此云明婆底此云妃其有容貌修羅欲害毗搜紐天故將此妹誘之以呪術力變閻浮提一處令陰暗自居暗處不令人見令妹明處語妹云若有人欲得娶汝為妻即報云我兄有大力若取我為妻必與兄相違若能與我兄戰乃可相許後毗搜紐天見心大悅之問云汝是何人答云是修羅童女天云修羅如吐娉諸天我無婦汝無夫相取可否女如兄先言報之天云汝今愛我故有此言我有大力能與汝兄戰遂許之修羅出明處問天汝是何人輒娶我妹為妻天云我非丈夫可為此責我是丈夫今何見怪修羅云汝有何能自一稱丈夫若與我戰得勝與汝妹為妻天云請當決之即各持刀搶互相斬刺天是那羅延力天身斫刺皆不得入天斫修羅手足支分隨斷還生至晚不息無有死狀天力稍弱緣覺疲困若更至夜修羅力盛明妃恐天不如即取婆羅華劈為兩片各擲一邊於其中間去而復來天解其意即提修羅身劈為兩片各擲一邊於其中間去而復來修羅即死為先於仙人處乞願云若我手足身分被斷即還復生所以不死仙人欲令諸天殺之不施劈身還復之願故致死也天居此地顯丈夫志能因此立名稱丈夫志國此土有國師婆羅門名憍尸迦有三子總名筏蘇盤豆自在天處乞得並取天祠之名其第三子比鄰持貞利反跋婆比鄰持母名跋婆譯為子亦云兒於有部出家得無學果其第二子即取總名於有部出家博學多聞遍通墳籍廣造衆論其大者名阿僧佉此云無著於化地部出家亦云於有部出家修定離欲得大乘空觀因此號曰阿僧佉世親於健陀羅國講婆沙論成六百行頌執小乘為是不信大乘是佛説無著見弟聰慧過人恐毀大乘論墮惡趣遣使往告我今有疾汝可速來世親隨來去兄住處四十里至一僧伽藍聞無著弟子誦華嚴經十地品發心感悟追悔甚深妙法昔所未聞方驗小乘為非誹謗之𠎝源發於舌舌為罪本今宜除斷即執銛刀欲割舌以謝其罪乃見無著住立告之曰夫大乘教者至真之理也諸佛所讚衆聖攸宗吾欲誨汝汝今自悟悟其明矣何善如之如諸佛聖教斷舌非悔汝設割舌不滅前罪汝既因舌謗大乘法而獲此罪若欲滅者當善讚説大乘大乘補過自然可令此罪速滅杜口絶言其理安在作是語已忽不復現世親承命遂不割舌只且詣無著住處咨受大乘於是研精𫟛思造五百大乘論解大乘經年八十於阿輸闍國捨命雖迹居凡地實難思議也纂者集也如三皇五帝有德有位立制作孔子有德無位述而不作今謂佛於餘二藏中已説窮理問答論教名現論主纂集於一處乃云論纂千部弘宣蓋遠者是上弘佛道法音遠布蓋由志也謂弘揚宣暢如來教典至遠約處遍大千界就時通萬二千年也發起良多者下化有情良者善也發起善信者多也又解由論教顯發義理有情以生得慧學論教能發生聞思等慧解多也論教功德大而言之不出上弘佛道下化有情故舉此二事也西明引論語云子夏問曰巧笑倩兮美目盻兮素以為絢兮何謂也解云此是子夏問詩義上二句在衛風碩人二章齊候女莊薑為衛莊公夫人莊公惑於嬖妾使驕上僭上聲莊薑賢而不答終以無子國人閔而憂之故作是詩注云倩好口輔也盻目白黑分也箋云此章説莊薑容貌之美也馬注論語云倩美笑貌也盻動目貌也素以為絢兮此一句逸也逸由失遭秦焚書失此句故詩不載也子曰繪事後素鄭注云繪畫文也凡畫繪先布衆綵然後以素分布其間以成其文喻薑女雖有倩盻美質亦須禮以成之也曰禮後乎注云子夏聞繪事後素言解以素喻禮故曰禮後乎子曰起豫者商也始與可言詩已矣解云子夏能發明夫子意如商可與共言詩也況論主造論再發起經律教也然用此意即弘宣蓋遠義同今不取也已上總歎千部論自下別彰此論揭去竭反高舉也音亦傑三蒼云舉也擔也負也莊子曰揭日月而行諸又云擔囊揭篋負匱而趍此皆訓舉也剖普厚反判也名相者名即諸法能詮名相即諸法體相或相狀也文約三十卷論事廣近即包婆沙發智等論遠則包含佛四十年前所説九部經律中事也工者巧也言若能究根界之旨者前來都歎此論之工也自下別述此論能根即根品此品明諸法用界即界品此品明諸法體旨者趣窮世聖之源者此兩品明世出世因果凡取力行因趣果莫過於此辨因果於真俗者釋上世聖之源也業品明俗諦因隨眠品明俗諦緣智品明真諦因定品明真諦緣也祛執滯於人我者祛者去也除也釋上究根界之旨此二品辨三科法門去我執也思已過去聲半者周易下繫云智者觀其彖辭則思已過半矣注夫彖者舉三象之統也又略例云彖者何也統論一卦之體明其所由之主者伏羲畫八卦又因而重之成六十四卦其後文王乃造卦下之辭謂之彖辭如乾卦云元亨利貞是也彖者斷也斷一卦之體吉凶之義亦云繇貞祐反辭繇者抽也抽一卦之大意也後周公又述六爻之辭爻如乾卦初九潛龍勿用等爻下辭故云爻辭也至孔子乃造十翼一上彖二下彖三上象四下象五上繫六下繫七文言八説卦九序卦十雜卦説此論似經律之彖辭十二部經中明初九部名過半也專攻説有而已者攻者伐也不但明小乘有教而已亦有大乘空義也或可不但説有部而已亦有經部等諸部義也自下第二此方傳譯分二初譯論二請造疏大唐三藏者姓陳東京偃師縣人也貞觀二年遊五天竺至十九年正月却屆長安得梵本六百五十七部俱舍是其一也二月六日奉詔於弘福寺翻譯也再譯真文者陳朝譯為初唐朝譯為再所詮理正文句定為真文親承密誨者三藏西方大乘諸師立破口授基法師小乘義授光法師如安慧師救論主義等是也自下第二請造疏正釋者即三十卷為正釋也既盡善美矣者論語云子謂韶盡美矣又盡善也謂武盡美矣未盡善也韶者舜樂名也夫聖人制樂隨人心為名也韶者紹也舜揖讓紹繼堯德故因制樂名也美者堪合當時之稱也善者理事不惡之名也天下萬人樂舜繼堯而舜從人受禪是合會當時之心故曰盡美也揖讓而代於理事盡旨故曰盡善也武者武王樂名當時殷紂為惡日久萬人怨怒武王征伐行武安天下之心故樂名武也天下樂武王武王從人而伐紂是會合當時之心故盡美也以臣伐君於理事不有善故云未盡善也今序意此論三藏初傳譯光法師承密誨制疏解釋盡理事之宜又何加尚於此而更請造疏耶三皇五帝三王樂名自古天皇地皇人皇氏五姓紀七十二姓紀三姓紀六姓紀四姓紀有巢氏燧人氏已前並未有禮樂百姓吸露精食草木之實不足山居者食吮禽獸居水者食魚龜飲血衣茹毛皮人多傷病至燧人氏始鑽木燧取火教人鑄金為釜鼎熟而食之故號燧人氏五行於是生焉至伏羲氏大昊方以木德王始作八卦以通神明製嫁娶之禮始作琴瑟之樂神農氏炎帝而嘉禾生醴泉出制本草造五絃琴作不謀之樂有熊氏黃帝姓公孫名軒轅作雲門咸池之樂金天氏小昊作九泉之樂高陽氏顓頊作承雲之樂又云使飛龍放八風音作五英之樂高辛氏帝嚳造鼙鼓鐘磬管箎作仁英之樂陶唐氏帝堯作大章之樂有虞氏帝舜作太韶之樂夏禹作大夏之樂殷湯作大濩之樂周武王作大武之樂此前燧人伏羲神農為三皇者白虎通云天之總美大稱也皇者煌煌焉人莫違也煩一夫擾一士勞天下不為也故黃金棄於山珠玉捐於淵巖居穴處衣皮毛飲泉液吮露英虗無寥廓與天地通靈也黃帝顓頊帝嚳堯舜為五帝帝者諦也象可承也德合天地者稱之帝帝者天號也夏殷周三王也王者往也天下所歸往也德合仁義稱之王王者五行之稱也王者所以盛禮作樂者何節民之喜怒也樂以法象天禮以法象地人無不合天地之氣有五常之性也樂所以蕩滌收其邪意也禮所以防淫泆節其流靡也樂在宗廟之中君臣上下同聽之則莫不和敬在於鄉里之中長幼同聽之即莫不和順在閨門之內父子兄弟同聽之即莫不和親是先王之樂意也此前意勿恐序也又何加焉加者增上也已上徵請意論岐巨岐反路也此下出請造疏意列子曰楊子之鄰人亡羊既率其黨又請楊子之豎追之楊子曰嘻亡一羊何追者衆也鄰人曰多岐路既反問獲羊乎曰亡之矣奚亡之曰岐路之中又有岐焉吾不知所之所以反也楊子戚然變容不言者移時不笑者竟日門人怪之請曰羊賤畜又非夫子之有而損言笑者何哉楊子不答門人不獲所命弟子孟孫陽出以告心都子都子他日與孟孫陽偕入而問曰昔有昆弟三人遊齊魯之間同師而學進仁義之道而歸其父曰仁義之道若何伯曰仁義使我愛身而後名身體髮膚不敢毀傷也仲曰仁義使我殺身以成名無求生以害仁有殺身以成仁也叔曰仁義使我身名並全既明且晢以保其身彼三微術相變而同出於儒孰是孰非耶楊子曰人有濵河而居者習於水勇於泅操舟鬻渡利供百口裹糧就學者成徒而溺死者幾半本學泅不學溺而利害如此若汝也以為孰是孰非都子默然而出孟孫陽讓責也之曰何吾子問之迂夫子答之僻吾惑俞甚心都子曰大道以多岐亡羊學者以多方喪生學非本不同非本不一而末異若是唯歸同同卦自得也反一性性者正性也為亡得喪吾子長先生之門習先生之道而不達先生之志也哀哉黷者數也亂也謂言詞繁數也易蒙卦彖辭云蒙亨匪我求童蒙童蒙求我初筮告再三黷黷即不告利貞解曰蒙有二義一者微蒙暗弱則童蒙二者蒙晦默則聖人也大象云山下出泉蒙君子以果行育德解曰上卦艮為山也下卦坎為泉也山下出泉四面為山所壅未知所適況初學者心中蒙昧有所決蒙之象也君子以果行者君子當發此蒙道以果決為行告示童蒙為決蒙之主也育德者謂隱默懷藏不自彰顯云自成聖德也亨者通也物既暗弱意願亨通也匪我師德明往求童蒙但暗者求明故童蒙求我也初者發始之辭筮者決疑之物童蒙既求我我當以初始一理正直之道以割決告之也再三黷黷則不告者師若以深廣二義告之則童蒙黷亂故不告也利貞者貞者正也言蒙之為義利以養正故也此上二文謂繁者請不敘之也今序用意三十卷諸部破立岐略之義説繁十五卷疏義理豐富辭多黷亂也幼好斯文者疏主幼年好學斯文長年此論獨步長安有人釋疏主十三講此論名幼好斯文十七造疏名長而獨得非疏主年五十已上方造疏居諸未幾者毛詩第二云日居月諸照臨下土言日月未幾疏即成也遽渠却反速也急也以簡則易知者易上繫云乾以易知坤以簡能易則易知簡則易從易知則有親易從則有功有親即可久有功則可大可久則賢人之德可大則賢人之業易簡而天下之理得矣意云乾有易知不難之德則四氣自成坤有簡靜不繁之德則萬物自生也乾坤既有簡易之德人亦法此乾坤則成可久大之功業也疏云以簡易知者以簡即坤易知即乾有功則坤可大則乾合言有功即可大互舉文者乾坤須兼有況此疏有簡靜易知令人成賢人之德業也俾者使也𢍉婢反後身廣慧西域記第五云天親無著師子覺三賢哲每相語曰凡修行業願覩慈氏若先捨壽得遂宿心當相報語以知所至其後師子覺先捨壽命三年不報世親菩薩尋亦捨壽時經六月亦無報命時諸異學咸皆譏誚以為彼二賢流轉惡趣遂無靈鑒其後無著菩薩於初夜分正為門人教授禪法燈光忽翳空中大明有一天仙乘空下降即進階庭頂禮無著無著曰爾來何暮今名何謂對曰從此捨命往覩史多天慈氏內衆蓮華中生蓮華才開從華臺下禮拜慈氏慈氏讚曰善來廣慧善來廣慧旋繞才周即來報命無著曰師子覺今何所在對曰我旋繞時見師子覺在外衆中耽著欲樂無暇相顧詎能來報矣淮西域記世親房在健陀羅國於此造俱舍論今此意云使廣慧菩薩遙證疏主釋此通方之教也過去衆賢永慚偏識者西域記第四云僧伽跋陀羅此云衆賢迦濕彌羅國人也聰敏博達幼傳雅譽特深研究説一切有部毗婆沙論時有世親菩薩秉心玄道求解言外破毗婆沙師所執作阿毗達磨俱舍論論辭義善巧理致精高衆賢修覽遂有心焉於是深研鑽極十有二年作俱舍雹論二萬五千頌凡八十萬言凡所製論言深致遠窮幽洞微復告門人曰以我逸才持我正論遂屈世親挫其鋒鋭無令老叟獨擅先名於是學徒四三俊彥持所作論推訪世親世親是時在北印度磔迦國奢羯羅城遠傳聲聞衆賢當至世親聞已即治行裝門人懷疑前進諫曰大師德高先哲名擅當時遠邇學徒莫不推謝今聞衆賢一何遑遽必有所下我曹厚顏世親曰吾今遠遊非避此子顧此國中無復鑒達衆賢後進也詭辨若流我衰耄矣莫能持論欲以一言頺其異執引至中印度對諸髦彥察乎真偽詳乎得失遂即命侶負笈遠遊衆賢至中印度秣底補羅國大都城南德光伽藍北三四里大伽藍中忽覺氣衰於是裁書謝世親曰如來寂滅弟子部執傳其宗學各擅專門黨同道嫉異部愚以冥昧猥承傳習覽所製阿毗達磨俱舍論破毗婆沙師大義輒不量力沉究彌年作為此論扶正宗學智小謀大死期將至菩薩宣暢微言抑揚至理不毀所執得存遺文斯為幸矣死何悔哉於是歷選門人有辭辨者而告之曰吾誠後學輕陵先達命矣也如何當從斯沒汝持是書及所製論謝彼菩薩代我悔過授辭適畢奄爾云亡門人奉書至世親所致辭曰我師衆賢已捨壽命遺言致書責躬謝咎不墜其名非所敢望也世親菩薩覽書閲論沉吟之久謂門人曰衆賢論師聰敏後進理雖不足詞乃有餘我今欲破衆賢之論若指諸掌顧以埀終之託重其知難之辭苟緣大義存其宿志況乎此論發明我宗遂為改題為順正理論門人諫曰衆賢未沒大師遠迹既得其論又為改題凡厥學徒何顏受愧世親為除衆疑而説頌曰如師子王避豕遠逝二力勝負智者應知衆賢死已焚尸收骨於伽藍西北二百餘步菴沒羅林中起率都婆今猶現在意云正理論為偏識令過去衆賢永慚見正理論偏識之説解後序文二初菩薩赴機論興之益二者正儀下明道俗興請製疏之由初分二初總歎千部次別彰此論者語詞也燭明幽暗北方稱幽南方稱明所以北方有幽州赫者盛也詩云赫赫明盛貌鼓動颽風爾雅云南風謂颽風東謂谷風西謂泰風北謂涼風李巡注云颽樂也言生長萬物萬物喜樂以時言之春曰谷風夏曰颽風秋曰泰風冬曰涼風詩颽風章云颽風自南音任一曰如字吹彼棘心棘心夭夭母氏劬勞解云此章美孝子也夏風謂之颽棘難長養者也夏風而能吹拂成長夭夭盛貌也劬勞病苦也颽風能吹長難成之棘喻寬仁之母劬勞養育七子夭夭之盛也序意雖春風亦成物舉颽風成棘取萬物極成也匡大教而濟時者匡正也謂菩薩匡持佛法以濟時機也此上義者由日有破暗之能風有成物之用菩薩有濟世之德故取之為況也爰由於也弘揚也道引導也五印度西域記云舊言身毒天竺等今從正音宜云印度印度之人隨地稱國殊方異俗遙舉想名語其所美謂之印度印度者此云月月有千名此名其一稱言諸羣生輪回不息無明長夜莫有司晨其猶白日既隱霄燭斯繼雖有星光之照豈如朗月之明苟緣斯致因而譬月良以其土聖賢繼軌道凡御物如月照臨由是義故謂之印度五印度境周九萬餘里三邊大海北有雪山北廣南狹形如半月畫野區分七十餘國時特暑熱地多泉濕躅者書云高步曰躅即光顯大師之教迹也言解外道之邪紛者即由製論能解外道異執之紛諍已上總歎千部自下別彰此論六足下自明八蘊者婆沙云雜結智業大種根定見也西音名健塗此云蘊蘊者聚諸法自類各集一處名蘊謂集種種異相論道判為雜蘊集結論道判為結蘊集智論道判為智蘊集業論道判為業蘊集大種論道判為大種蘊根定見準説宗唯以正者論主情無偏黨學該諸部凡厥正義咸以遵崇潤色者論語云為命諶草創之世叔討論之行人子羽修飾之東里子産潤色之此四者皆鄭大夫為命謂作盟會之詞諶性靜怯若為其君作盟會之詞即入草野中以創立之世叔不能草創但能討論治正諶所造之辭又子羽不能討論但取二人所創治者更雕琢修飾之子産又但采文潤色之徑此四賢手懸之千古聰明者尚書云聰明視聽遠家語云聰以知遠明以察微謂此論見聞廣也文蓋雲間者晉書曰陸雲字士龍吳郡人也荀鳴鶴頴川人時士龍在司空張華座鳴鶴後至座上諸賓素聞鶴名皆為之起鳴鶴曰清風至飛塵揚士龍曰凡鳥集鳳凰翔既而座定荀陸二人敘溫涼陸曰雲間陸士龍荀曰日下荀鳴鶴時人謂之佳對縉紳者漢書云縉者插也字應從手紳者大帶古禮插笏於紳當𮌎直插非如今腰間斜貫今時行禮猶依古也縉字若從糸即帛也赤也此謂衣冠之士龜鏡者龜曰卜蓍曰筮皆考疑事也龜可以決疑鏡可以鑒物又云為龜之靈也知先兆之吉凶為鏡之明也鑒物像之好醜言其佩縉紳之服類龜鏡之明也既勤勤於法門屬自身不懈怠之貌孜孜子之反咀慈呂反兼濟者窮則獨擅一身達則兼濟天下遭遇狎習蘭室者家語云與善人居如入芝蘭之室久不聞其香即與之化矣與不善人居如入鮑魚之肆久不聞其臰亦與之化矣今疏主接侍郎如狎芝蘭之室也夕殞者論語云朝聞道夕死可矣質而不文者論語云質勝文則野注云鄙野也文勝質則史史者文多質少也文質彬彬然後君子彬彬文質相半貌也味道君子俗士義學精人僧衆鸞鏡者宋寶華泰鸞詩序云罽賓國王網得一鸞欲得鳴而不能致夫人曰妾聞鸞得雙則鳴舞以鏡照之鸞覩鏡中影悲鳴却鏡而死因號鸞鏡矣吳越春秋云楚王召風湖子而告之曰寡人聞吳有干將越有歐冶寡人欲因子請此二人作劒可乎風湖子乃往見二子令作之一曰龍泉二曰大阿豫章記云吳猛未言之前常有紫氣見於牛斗之間占者以為吳王再興唯張司空以為不然及吳平後紫氣逾明華聞雷孔章妙達緯象乃令觀之章曰無他象唯是寶物之精在豫章豐城縣華遂以章為豐城令至縣堀深二丈得一青玉匣長八九尺開之得二劒其夕牛斗氣不復見後章留其一匣龍泉進之張公張公遇害此劒飛入襄城水中也吳猛豫章人也少有孝行夏日常不驅蚊懼其去已而噬親年三十邑人丁義始授其神方因還豫章江波甚急不假舟楫以白羽扇畫水而渡覩者殊異之敏者達也聰也舊本卷尾載明有無漏色斷惑及五果文一紙半餘然非是有關繫二序亦其文非盈師語氣有本注曰古本朱書之知是本學者抄記而且贅此末者後人以墨代朱爾來謹録傳寫依舊耳故今除之矣又後有記云乾元寺僧令端時會昌三年值難唯手抄一卷將供養後人有傳持者請當敘之憶而矣敕福州觀察處量等御中文語鄙俚未足當一笑多是妄人欲眩惑人然紕繆陋拙非復袁鉉族譜則一見可知耳或本有寬信跋文曰仁平元年八月勘內外本文而加添削又語周防公寬尊引載周易本文又載永正年間三井無約跋語曰對四本校勘之其中闕略亂脫諸本互有此本者任意抄謄或除或加然則此記屢歷後人訂正顧失盈公之真者亦不鮮耳若夫沓偨俿者亦安知非盈公千歲之冤也有人曰法盈者圓暉弟子見尚慧俱舍私抄第十一而此記智證大師入唐請來余皆未能考之伏俟博洽云爾道空識
