front:
  text: 刻法盈俱舍頌疏敘記序有人嘗登眺某之山履嶔嶇披灌莾然欲極其絶頂奇勝之處而探虎豹之穴踐虬龍之居則羸弊甚至蹣跚踸踔遂不能而歸焉爾後盍簮聚首流連酣暢之餘有人之誇詡其絶頂之勝事則多恨恨𮌎間不勝其遺憾曰所不重遊而探剔其奇者有如日亦人嘗遊某之山挹空翠於層巒捫飛蘿于復嶝息促吻張作鋸木聲然到其所謂絶奇者則往往酸骨咋指殆似與性命衡既而歸焉則委頓三日室外咫尺由企楚越然憶其奇絶之趣則償其頓弊當其所聞之者或甚鮮今夫世之學者之於古典似人之登眺者亦不為少也法盈師俱舍頌疏敘記者援據解釋苞舉縷扸實教黌之間學者崇焉與夫近時之所謂木災者太有徑庭若其未襲篋笥之徒豈得無夫人之登某山而不能極其奇勝之恨乎然研玩之則援據之而有沓焉辟猶駭醫之窮撿毒箭於垂死者解釋之而有偨俿焉辟猶下才而牝黃乎牡驪者要之所謂稽古有餘發明不足者耳尋繹之者亦未可無夫人之遊某山之絶奇而歸後之恨者也記故無梓今梓之流焉然今之梓也唯為夫似指日矢重遊之者謀之耳與夫若頓臥一室楚越咫尺之者之與其一等之謂頌疏之於對法藏其既仳離矣況於瑣尾頌疏之序之記乎無乃學泅還溺哉者蓋未敢謀之耳元祿癸未秋九月日沙門道空敘
